openapi: 3.0.0
info:
  title: Pacman Demo Actions
  version: 0.1.0
  description: >
    Conceptual API-style contracts for Pacman demo actions. These describe the
    shape of commands and state queries between a host application and the
    Pacman engine, even though they are implemented as in-process calls rather
    than network endpoints.

paths:
  /pacman/session:
    post:
      summary: Start a new Pacman session
      description: Initialize a new Pacman session with default maze, score, and lives.
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacmanSession'

  /pacman/session/{sessionId}/input:
    post:
      summary: Submit directional input for Pacman
      description: >
        Apply a directional intent from the on-screen keyboard to the Pacman
        session for the next update tick.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InputCommand'
      responses:
        '202':
          description: Input accepted

  /pacman/session/{sessionId}/restart:
    post:
      summary: Restart the Pacman session
      description: Reset score, lives, positions, and pellets to initial values.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session restarted

  /pacman/session/{sessionId}/state:
    get:
      summary: Get current Pacman session state
      description: Retrieve positions, score, lives, and status for rendering and HUD.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current session state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacmanSession'

components:
  schemas:
    InputCommand:
      type: object
      properties:
        direction:
          type: string
          enum: [up, down, left, right, none]
        restart:
          type: boolean
      required: [direction]

    PacmanSession:
      type: object
      properties:
        id:
          type: string
        score:
          type: integer
        livesRemaining:
          type: integer
        status:
          type: string
          enum: [running, gameOver, completed]
        pelletsRemaining:
          type: integer
        pacman:
          $ref: '#/components/schemas/PacmanEntity'
        ghosts:
          type: array
          items:
            $ref: '#/components/schemas/GhostEntity'
      required:
        - id
        - score
        - livesRemaining
        - status
        - pelletsRemaining

    PacmanEntity:
      type: object
      properties:
        x:
          type: integer
        y:
          type: integer
        direction:
          type: string
          enum: [up, down, left, right, none]

    GhostEntity:
      type: object
      properties:
        id:
          type: string
        x:
          type: integer
        y:
          type: integer
        direction:
          type: string
          enum: [up, down, left, right, none]

